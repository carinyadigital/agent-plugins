name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Structural validation
        run: python3 scripts/validate.py --format json

      - name: Ralph validation
        run: python3 skill-authoring/scripts/validate_ralph.py --quiet

      - name: Ralph mutation tests
        run: python3 skill-authoring/scripts/mutation-test.py

      - name: Test
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
