# Default allowlist for agency-hub
# Generated by /agency-hub:setup — edit this file to change what's trusted.
#
# SECURITY NOTE: Default is RESTRICTIVE — unknown sources are refused.
# Fail-closed is the right default for a tool that installs third-party code
# into a privileged agency workspace.

mode: restrictive # restrictive (fail-closed, default) | permissive (flag-and-ask)

registries: []
  # Add agency skills registries you trust.

publishers: []
  # GitHub usernames / org names trusted to ship skills.

connectors: []
  # Empty in restrictive mode: community skills declaring ANY MCP connector
  # will be refused until listed here.

licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0
